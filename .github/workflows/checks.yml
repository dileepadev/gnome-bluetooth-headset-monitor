name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y gjs dbus-daemon libgtk-4-1 libglib2.0-bin gettext
      - run: npm ci
      - name: Run lint, regression tests, and packaging checks
        run: npm run check
      - name: Build development extension ZIP
        run: npm run pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-development-build
          path: dist/*.shell-extension.zip
